name: RI v0.4 recovery — experimental test suite
on:
  push:
    branches:
      - 'recovery/**'
  pull_request:

permissions:
  contents: read

jobs:
  legacy-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install optional OpenCV for fiducial tests
        run: python -m pip install -e ".[fiducials]"
      - name: Run archived experimental test suite
        run: python -m unittest discover -s tests -v
