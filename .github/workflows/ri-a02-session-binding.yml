name: RI-A02 session binding
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  session-local:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install original offline dependencies and registry validator
        run: python -m pip install -e ".[fiducials]" "jsonschema==4.23.0"
      - name: Frozen baseline and registry regressions
        run: |
          python scripts/check_compat_registry.py --git-baseline
          python -m unittest discover -s tests_registry -v
      - name: Original RI suite and additive session resolver tests
        run: |
          python -m unittest discover -s tests -v
          python -m unittest discover -s tests_session -v
          python -O -m unittest discover -s tests_session -v
  owner-compat:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RI_CHECKOUT: ${{ github.workspace }}
      CONSOLE_OWNER_CHECKOUT: ${{ github.workspace }}/.upstream/console-owner
      CONSOLE_CHECKOUT: ${{ github.workspace }}/.upstream/console-main
      COG_OWNER_CHECKOUT: ${{ github.workspace }}/.upstream/cog
      PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/.upstream/cog/src
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: OpenRGD/rgd-console
          ref: 82049654438cc2061d17643440806ad09ed684e5
          path: .upstream/console-owner
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: OpenRGD/rgd-console
          ref: a0ef857cf425c1bb14ad8f62acec21f8c1324866
          path: .upstream/console-main
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: OpenRGD/rgd-cognition
          ref: 9235d3759b263bfde2d8644c46845e9a338e9238
          path: .upstream/cog
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact owner revisions and original RI schema
        run: |
          test "$(git -C "$CONSOLE_OWNER_CHECKOUT" rev-parse HEAD)" = 82049654438cc2061d17643440806ad09ed684e5
          test "$(git -C "$CONSOLE_CHECKOUT" rev-parse HEAD)" = a0ef857cf425c1bb14ad8f62acec21f8c1324866
          test "$(git -C "$COG_OWNER_CHECKOUT" rev-parse HEAD)" = 9235d3759b263bfde2d8644c46845e9a338e9238
          test "$(git hash-object contracts/consumer-observation-ref.v0.1-candidate.schema.json)" = 3d92e074e71593bf6db0a735394c628ea131668d
          test "$(git hash-object "$CONSOLE_CHECKOUT/contracts/console/v1/imu-observation.v0.1.schema.json")" = 8ddbe8d7639e35f0a9442a80e27c9e49f882eb7c
          python -m pip install "jsonschema==4.23.0"
      - name: Existing Console owner suite against additive RI source
        run: python -m unittest discover -s "$CONSOLE_OWNER_CHECKOUT/scripts/tests" -p 'test_ri_periph_compat.py' -v
      - name: Install exact Cognition test dependencies
        run: python -m pip install -r "$COG_OWNER_CHECKOUT/requirements-ci.txt"
      - name: Existing Cognition owner RI01 and RI02 suites against additive RI source
        run: |
          python -m unittest discover -s "$COG_OWNER_CHECKOUT/tests_ri" -v
          python -m unittest discover -s "$COG_OWNER_CHECKOUT/tests_ri02" -v
      - name: New resolver against genuine owner fixtures without adopting COG copy
        run: python -m unittest discover -s tests_session_external -v
