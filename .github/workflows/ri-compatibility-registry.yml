name: RI-A01 compatibility registry
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  registry:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install development-only schema validator
        run: python -m pip install jsonschema==4.23.0
      - name: Validate engineering snapshot against the original Git tree
        run: python scripts/check_compat_registry.py --git-baseline
      - name: Run offline positive and negative registry tests
        run: python -m unittest discover -s tests_registry -v
